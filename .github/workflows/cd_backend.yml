name : Deploy the backend
on: 
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: tabishkhan090/app-backend:${{ github.sha }}

      - name: Deploy to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ssh_key
          chmod 600 ssh_key

          ssh -o StrictHostKeyChecking=no -i ssh_key devops@20.187.150.147 << 'EOF'
            docker pull tabishkhan090/app-backend:${{ github.sha }}

            docker stop user_backend || true
            docker rm user_backend || true

            docker run -d \
              --name user_backend \
              -p 8082:8082 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              tabishkhan090/app-backend:${{ github.sha }}
          EOF