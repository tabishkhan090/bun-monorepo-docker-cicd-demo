name: Deploy web server
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      # - name: Create env file for web
      #   run: |
      #     echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/web/.env.production

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          push: true
          tags: tabishkhan090/app-web:${{ github.sha }}

      - name: Deploy to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ssh_key
          chmod 600 ssh_key

          ssh -o StrictHostKeyChecking=no -i ssh_key devops@20.187.150.147 << 'EOF'
            docker pull tabishkhan090/app-web:${{ github.sha }}

            docker stop user_web || true
            docker rm user_web || true

            docker run -d \
              --name user_web \
              -p 8080:8080 \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              tabishkhan090/app-web:${{ github.sha }}
          EOF